[package]
name = "fablegame"
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
default-run = "fablegame"

[features]
# gpu memory use in the --fps-log lines, for profiling
mem-stats = ["wgpu/counters"]

[dependencies]
# discord rich presence over its local ipc (discord.rs).
discord-rich-presence = "1.1.0"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
earcutr = "0.5.0"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
# the launcher's window (src/bin/fableflight-launcher); the same egui and wgpu
# as the game, so it adds little to the build
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "links", "clipboard"] }
ab_glyph = "0.2.32"
env_logger = "0.11.11"
flate2 = "1.1.11"
gilrs = "0.11.2"
glam = { version = "0.34.3", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
parking_lot = "0.13.0"
pollster = "1.0.1"
# whisper's token table (atc/listen.rs), the same base64 ureq already builds.
base64 = "0.23.1"
# the microphone for push to talk (atc/listen.rs), the same cpal rodio plays through.
cpal = "0.18.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
# SHA-256 for the FSR 4 runtime download (already built for ureq's TLS).
ring = "0.17"
wgpu = "30"
winit = "0.30"
roxmltree = "0.20"
rustc-hash = "2"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
# ATC voices (src/atc/tts.rs): Kokoro through ONNX Runtime, loaded at run time
# from the downloaded voice pack, never linked in. A 2.0 release candidate:
# keep it pinned.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
# Ogg Vorbis decoding for the menu music (src/audio/music.rs); pure Rust.
lewton = "0.10.2"

# Windows: shaders compiled with DXC built in. wgpu otherwise falls back to
# FXC, which can't compile the composite pass (it gives up unrolling its
# loops: error X3511), so the game crashed on start whenever wgpu picked
# DirectX 12, as on WARP or machines without a Vulkan driver. wgpu's default
# compiler choice (Auto) uses the built-in DXC when it is there. x86-64 MSVC only.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", features = ["static-dxc"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# opens Feral GameMode's client library (gamemode.rs, Linux) and AMD's FSR 4
# runtime (fsr4.rs, Windows) at run time
libloading = "0.8"
# Vulkan handles for AMD's FSR 4 runtime (fsr4.rs); the version wgpu-hal uses
ash = "0.38"

[dev-dependencies]
# Keep in step with wgpu's naga version when upgrading wgpu.
naga = { version = "=30.0.1", features = ["wgsl-in", "msl-out"] }

# the release you build and play: thin lto over many codegen units, kept
# between builds, so a change relinks in a fraction of the time.
[profile.release]
lto = "thin"
codegen-units = 16
incremental = true

# the build that ships (release.yml): full lto and one codegen unit, a few
# percent faster and far slower to build. cargo build --profile dist.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# optimised dependencies so debug builds stay playable.
# line numbers only, not full debug info: a fraction of the size and much faster to link.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
